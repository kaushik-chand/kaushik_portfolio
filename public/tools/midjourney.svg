  <path fill="#FFFFFF" d="M18 72 Q18 10 50 8 Q50 8 50 72 Z"/>
  <!-- Small inner sail -->
  <path fill="#FFFFFF" d="M52 72 Q52 30 68 20 Q68 20 68 72 Z"/>
  <!-- Hull -->
