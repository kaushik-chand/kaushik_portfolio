  <!-- Waves -->
  <path fill="#FFFFFF" d="M8 86 Q20 82 32 86 Q44 90 56 86 Q68 82 80 86 Q90 89 92 86"/>
  <path stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" d="M8 86 Q20 82 32 86 Q44 90 56 86 Q68 82 80 86 Q88 89 93 86"/>
  <path stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" d="M10 93 Q22 89 34 93 Q46 97 58 93 Q70 89 82 93"/>
</svg>
