<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Adobe Firefly">
  <!-- Adobe Firefly: rounded square border with "Fi" text and sparkle star -->
  <rect x="6" y="6" width="88" height="88" rx="18" ry="18" fill="none" stroke="#000000" stroke-width="5"/>
  <!-- "F" letter -->
  <text x="16" y="68" font-family="Georgia, serif" font-size="50" font-weight="400" fill="#000000" letter-spacing="-2">Fi</text>
  <!-- Sparkle/star at top-right of the "i" -->
  <g transform="translate(68, 22)">
    <!-- 4-point sparkle -->
    <path fill="#000000" d="M0 -10 L1.5 -1.5 L10 0 L1.5 1.5 L0 10 L-1.5 1.5 L-10 0 L-1.5 -1.5 Z"/>
  </g>
</svg>
